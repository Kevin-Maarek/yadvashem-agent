name: yadvashem-archive-search

x-backend: &backend
  build: ./backend
  image: yadvashem-archive-search-backend:local
  environment:
    PGHOST: postgres
    PGDATABASE: ${POSTGRES_DB:-archive}
    PGUSER: ${POSTGRES_USER:-archive}
    PGPASSWORD: ${POSTGRES_PASSWORD:-archive-local}
  env_file:
    - .env
  init: true
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archive}
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive-local}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9.19
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin-local}
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/venv/bin/python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1/misc/ping', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped
  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "worker"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 165s
    healthcheck:
      test: ["CMD", "python", "-m", "worker", "--health"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    image: yadvashem-archive-search-frontend:local
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3030}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  postgres:
  pgadmin:
